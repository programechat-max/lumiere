version: "3.9"

# LUMIERE platform - yerel geliştirme altyapısı (PROMPT 1 & PROMPT 5).
# Kullanım:
#   docker compose up -d postgres pgadmin redis        # sadece altyapı
#   docker compose --profile worker up -d               # + Celery worker & Flower
#
# Backend'i PostgreSQL + Redis'e bağlamak için backend/.env içine ekleyin:
#   DATABASE_URL=postgresql+psycopg://lumiere:lumiere_dev_password@localhost:5432/lumiere
#   REDIS_URL=redis://localhost:6379/0

services:
  api:
    build:
      context: ./backend
    container_name: lumiere_api
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://lumiere:lumiere_dev_password@postgres:5432/lumiere
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      # Local iPhone/WKWebView and the optional file:// smoke-test page. The
      # `null` origin is intentionally limited to this development compose
      # file; production must use explicit HTTPS origins only.
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://192.168.0.3:5173,capacitor://localhost,ionic://localhost,http://localhost,null
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - lumiere_media:/tmp/lumiere-media
      - lumiere_media:/app/user_videos
      - lumiere_media:/app/user_audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: lumiere_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: lumiere_dev_password
      POSTGRES_DB: lumiere
    ports:
      - "5432:5432"
    volumes:
      - lumiere_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumiere"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lumiere_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me-locally}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: lumiere_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Aşağıdaki servisler `--profile worker` ile isteğe bağlı başlatılır ---
  celery_worker:
    build:
      context: ./backend
    container_name: lumiere_celery_worker
    profiles: ["worker"]
    # Görevler high/medium/low kuyruklarına route ediliyor; worker hepsini dinlemeli.
    # Yerel Docker'da solo havuzu kullan: macOS/ARM üzerinde prefork child
    # süreçleri hata nesnelerini geri taşırken ai_core import çökmesine yol açabiliyor.
    # `-E` emits task lifecycle events so Flower's task list is authoritative;
    # without it Flower stays empty even while the worker executes jobs.
    command: celery -A celery_app worker --loglevel=info --events --pool=solo --concurrency=1 -Q celery,high,medium,low
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://lumiere:lumiere_dev_password@postgres:5432/lumiere
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - lumiere_media:/tmp/lumiere-media
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -d celery@$${HOSTNAME} | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_beat:
    build:
      context: ./backend
    container_name: lumiere_celery_beat
    profiles: ["worker"]
    command: celery -A celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://lumiere:lumiere_dev_password@postgres:5432/lumiere
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/cmdline && tr '\\0' ' ' < /proc/1/cmdline | grep -q 'celery.*beat'"]
      interval: 30s
      timeout: 5s
      retries: 3

  flower:
    build:
      context: ./backend
    container_name: lumiere_flower
    profiles: ["worker"]
    command: celery -A celery_app flower --port=5555
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  lumiere_postgres_data:
  lumiere_media:
